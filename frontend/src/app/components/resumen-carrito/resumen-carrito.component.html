<h2>Resumen del carrito</h2>

<div *ngIf="itemsCarrito().length === 0">
  <p>El carrito está vacío.</p>
</div>

<table *ngIf="itemsCarrito().length > 0">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Precio unitario</th>
      <th>Cantidad</th>
      <th>Subtotal</th>
      <th>Acción</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of itemsCarrito()">
      <td>{{ item.nombre }}</td>
      <td>{{ item.precio | currency:'Q' }}</td>
      <td>
        <input
          type="number"
          min="1"
          [value]="item.cantidad"
          (change)="actualizarCantidad(item.id, $any($event.target).value)"
        />
      </td>
      <td>{{ item.precio | subtotal:item.cantidad | currency:'Q' }}</td>
      <td>
        <button (click)="eliminarProducto(item.id)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

<h3 *ngIf="itemsCarrito().length > 0">
  Total: {{ itemsCarrito() | totalCarrito | currency:'Q' }}
</h3>

<button (click)="vaciarCarrito()">Vaciar Carrito</button>
